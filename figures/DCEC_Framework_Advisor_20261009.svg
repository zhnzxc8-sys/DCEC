<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#526b80"/></marker></defs><rect width="1800" height="1440" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="60" y="55" font-size="38" fill="#183149" text-anchor="start">DCEC: Method Overview and Research Status</text><text x="60" y="90" font-size="21" fill="#63788a" text-anchor="start">Advisor review | Main configuration: A3/no_sem | Evidence recorded in the September 30, 2026 draft</text><text x="60" y="145" font-size="28" fill="#183149" text-anchor="start">A. Fixed-parameter inference</text><rect x="60" y="190" width="250" height="110" rx="12" fill="#edf3f8" stroke="#8298aa" stroke-width="1.5"/><text x="185.0" y="225" font-size="24" fill="#183149" text-anchor="middle">Corrupted image</text><text x="185.0" y="260" font-size="19" fill="#183149" text-anchor="middle">Single input image</text><rect x="385" y="190" width="350" height="110" rx="12" fill="#edf3f8" stroke="#8298aa" stroke-width="1.5"/><text x="560.0" y="225" font-size="24" fill="#183149" text-anchor="middle">Frozen image encoder</text><text x="560.0" y="260" font-size="19" fill="#183149" text-anchor="middle">CLIP ViT-B/32</text><text x="560.0" y="291" font-size="19" fill="#183149" text-anchor="middle">Embedding z_d: 512D</text><rect x="60" y="355" width="340" height="185" rx="12" fill="#edf3f8" stroke="#8298aa" stroke-width="1.5"/><text x="230.0" y="390" font-size="24" fill="#183149" text-anchor="middle">Quality descriptor</text><text x="230.0" y="425" font-size="19" fill="#183149" text-anchor="middle">5D image statistics</text><text x="230.0" y="456" font-size="19" fill="#183149" text-anchor="middle">Luminance mean / std</text><text x="230.0" y="487" font-size="19" fill="#183149" text-anchor="middle">Laplacian / high-frequency</text><text x="230.0" y="518" font-size="19" fill="#183149" text-anchor="middle">8-pixel boundary response</text><rect x="465" y="370" width="270" height="125" rx="12" fill="#e9f5ef" stroke="#8298aa" stroke-width="1.5"/><text x="600.0" y="405" font-size="24" fill="#183149" text-anchor="middle">Condition encoder</text><text x="600.0" y="440" font-size="19" fill="#183149" text-anchor="middle">MLP: 5 → 32 → 64</text><text x="600.0" y="471" font-size="19" fill="#183149" text-anchor="middle">Condition vector c</text><rect x="835" y="190" width="405" height="140" rx="12" fill="#e9f5ef" stroke="#8298aa" stroke-width="1.5"/><text x="1037.5" y="225" font-size="24" fill="#183149" text-anchor="middle">Residual corrector</text><text x="1037.5" y="260" font-size="19" fill="#183149" text-anchor="middle">Input: [z_d; c]</text><text x="1037.5" y="291" font-size="19" fill="#183149" text-anchor="middle">MLP: 576 → 256 → 512</text><text x="1037.5" y="322" font-size="19" fill="#183149" text-anchor="middle">Residual Δz; zero-initialized output</text><rect x="835" y="370" width="405" height="125" rx="12" fill="#e9f5ef" stroke="#8298aa" stroke-width="1.5"/><text x="1037.5" y="405" font-size="24" fill="#183149" text-anchor="middle">Auxiliary gate</text><text x="1037.5" y="440" font-size="19" fill="#183149" text-anchor="middle">MLP: 64 → 32 → 1</text><text x="1037.5" y="471" font-size="19" fill="#183149" text-anchor="middle">g = sigmoid(·)</text><rect x="1340" y="270" width="400" height="125" rx="12" fill="#e9f5ef" stroke="#8298aa" stroke-width="1.5"/><text x="1540.0" y="305" font-size="24" fill="#183149" text-anchor="middle">Corrected embedding</text><text x="1540.0" y="340" font-size="19" fill="#183149" text-anchor="middle">z_corr = Norm(z_d + g × Δz)</text><rect x="60" y="590" width="250" height="100" rx="12" fill="#edf3f8" stroke="#8298aa" stroke-width="1.5"/><text x="185.0" y="625" font-size="24" fill="#183149" text-anchor="middle">Candidate texts</text><text x="185.0" y="660" font-size="19" fill="#183149" text-anchor="middle">Text descriptions</text><rect x="385" y="590" width="350" height="100" rx="12" fill="#edf3f8" stroke="#8298aa" stroke-width="1.5"/><text x="560.0" y="625" font-size="24" fill="#183149" text-anchor="middle">Frozen text encoder</text><text x="560.0" y="660" font-size="19" fill="#183149" text-anchor="middle">Text embeddings t_j: 512D</text><rect x="1340" y="590" width="400" height="125" rx="12" fill="#edf3f8" stroke="#8298aa" stroke-width="1.5"/><text x="1540.0" y="625" font-size="24" fill="#183149" text-anchor="middle">Similarity and ranking</text><text x="1540.0" y="660" font-size="19" fill="#183149" text-anchor="middle">cos(z_corr, t_j)</text><text x="1540.0" y="691" font-size="19" fill="#183149" text-anchor="middle">Image-to-text / text-to-image</text><polyline points="310,245 385,245" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><polyline points="185,300 185,355" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><polyline points="400,430 465,430" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><polyline points="735,245 835,245" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><polyline points="600,370 600,350 790,350 790,295 835,295" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><polyline points="735,430 835,430" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><polyline points="1240,245 1290,245 1290,300 1340,300" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><polyline points="1240,430 1290,430 1290,365 1340,365" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><polyline points="560,190 560,172 1540,172 1540,270" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><polyline points="310,640 385,640" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><polyline points="735,640 1340,640" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><polyline points="1540,395 1540,590" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)"/><text x="60" y="555" font-size="21" fill="#63788a" text-anchor="start">Trainable: green blocks | Frozen or fixed: blue blocks</text><text x="60" y="737" font-size="23" fill="#183149" text-anchor="start">No clean image, parameter updates, or target-batch statistics are required at inference.</text><text x="60" y="795" font-size="28" fill="#183149" text-anchor="start">B. Training supervision</text><rect x="60" y="830" width="510" height="145" rx="12" fill="#fff3e2" stroke="#8298aa" stroke-width="1.5"/><text x="315.0" y="865" font-size="24" fill="#183149" text-anchor="middle">Frozen clean-image teacher</text><text x="315.0" y="900" font-size="19" fill="#183149" text-anchor="middle">Paired clean image + candidate texts</text><text x="315.0" y="931" font-size="19" fill="#183149" text-anchor="middle">Clean CLIP similarity distributions</text><text x="315.0" y="962" font-size="19" fill="#183149" text-anchor="middle">Teacher distributions are detached</text><rect x="650" y="830" width="620" height="145" rx="12" fill="#fff3e2" stroke="#8298aa" stroke-width="1.5"/><text x="960.0" y="865" font-size="24" fill="#183149" text-anchor="middle">Bidirectional distillation + regularization</text><text x="960.0" y="900" font-size="19" fill="#183149" text-anchor="middle">L_rank: KL(teacher || corrected), both directions</text><text x="960.0" y="931" font-size="19" fill="#183149" text-anchor="middle">L_res: mean(Δz²)</text><text x="960.0" y="962" font-size="19" fill="#183149" text-anchor="middle">A3 objective: L_rank + 0.001 L_res; λ_sem = 0</text><rect x="1350" y="830" width="390" height="145" rx="12" fill="#fff3e2" stroke="#8298aa" stroke-width="1.5"/><text x="1545.0" y="865" font-size="24" fill="#183149" text-anchor="middle">Update DCEC only</text><text x="1545.0" y="900" font-size="19" fill="#183149" text-anchor="middle">CLIP remains frozen</text><text x="1545.0" y="931" font-size="19" fill="#183149" text-anchor="middle">Select checkpoint on validation</text><text x="1545.0" y="962" font-size="19" fill="#183149" text-anchor="middle">Freeze before final testing</text><polyline points="570,900 650,900" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 6"/><polyline points="1270,900 1350,900" fill="none" stroke="#526b80" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 6"/><text x="60" y="1025" font-size="28" fill="#183149" text-anchor="start">C. Evidence available and work to complete</text><rect x="60" y="1060" width="520" height="240" rx="12" fill="#e9f5ef" stroke="#8298aa" stroke-width="1.5"/><text x="320.0" y="1095" font-size="24" fill="#183149" text-anchor="middle">Completed: model evaluation</text><text x="320.0" y="1130" font-size="19" fill="#183149" text-anchor="middle">Three independent training seeds</text><text x="320.0" y="1161" font-size="19" fill="#183149" text-anchor="middle">Validation: 7 corruptions × 3 severities</text><text x="320.0" y="1192" font-size="19" fill="#183149" text-anchor="middle">Frozen final test: 1,000 images</text><text x="320.0" y="1223" font-size="19" fill="#183149" text-anchor="middle">Positive gains over Frozen: 22/22</text><text x="320.0" y="1254" font-size="19" fill="#183149" text-anchor="middle">Mean final-test gain: +1.513 points</text><rect x="640" y="1060" width="520" height="240" rx="12" fill="#e9f5ef" stroke="#8298aa" stroke-width="1.5"/><text x="900.0" y="1095" font-size="24" fill="#183149" text-anchor="middle">Completed: supporting analyses</text><text x="900.0" y="1130" font-size="19" fill="#183149" text-anchor="middle">Frozen / DN / TCR comparisons</text><text x="900.0" y="1161" font-size="19" fill="#183149" text-anchor="middle">A1–A4 controlled ablations</text><text x="900.0" y="1192" font-size="19" fill="#183149" text-anchor="middle">Direction, scale and matching interventions</text><text x="900.0" y="1223" font-size="19" fill="#183149" text-anchor="middle">Image-level mechanism statistics</text><text x="900.0" y="1254" font-size="19" fill="#183149" text-anchor="middle">Adapter and end-to-end profiling</text><rect x="1220" y="1060" width="520" height="240" rx="12" fill="#fff3e2" stroke="#8298aa" stroke-width="1.5"/><text x="1480.0" y="1095" font-size="24" fill="#183149" text-anchor="middle">Pending: evidence strengthening</text><text x="1480.0" y="1130" font-size="19" fill="#183149" text-anchor="middle">Comparable baseline repetitions</text><text x="1480.0" y="1161" font-size="19" fill="#183149" text-anchor="middle">Cross-method significance analysis</text><text x="1480.0" y="1192" font-size="19" fill="#183149" text-anchor="middle">Review and assess 2026 methods</text><text x="1480.0" y="1223" font-size="19" fill="#183149" text-anchor="middle">Broader datasets / backbones</text><text x="1480.0" y="1254" font-size="19" fill="#183149" text-anchor="middle">Descriptor latency optimization</text><text x="60" y="1350" font-size="23" fill="#183149" text-anchor="start">Supported claim: stable gains over Frozen CLIP; relative gains over DN and TCR are condition-dependent.</text><text x="60" y="1388" font-size="21" fill="#63788a" text-anchor="start">Open boundaries: mild corruptions, motion blur, and the end-to-end cost of descriptor extraction.</text></g></svg>